onboarding = false
[theme]
name = "terminal"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
edit_scrollback = "prefix+v"
previous_tab = ""
next_tab = ""
previous_agent = "prefix+p"
next_agent = "prefix+n"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

[advanced]
scrollback_limit_bytes = 10000000

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui.toast.herdr]
position = "bottom-right"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = false

[ui.sidebar.agents]
rows = [["state_icon", "agent", "state_text"], ["workspace"]]
