onboarding = false

[theme]
name = "terminal"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
edit_scrollback = "prefix+v"
previous_tab = ""
next_tab = ""
previous_agent = "prefix+p"
next_agent = "prefix+n"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

[advanced]
scrollback_limit_bytes = 10000000

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = "~/.local/bin/herdr-agent-status", interval_seconds = 3, timeout_seconds = 2 },
  { type = "command", command = "~/.local/bin/herdr plugin action invoke juju.tab-titles.refresh >/dev/null 2>&1", interval_seconds = 3, timeout_seconds = 5 },
]
tab_bar_right_separator = " "

[ui.sidebar.agents]
rows = [["state_icon", "agent", "state_text"]]
