# GENERATED by wallust from ~/.config/wallust/templates/herdr.toml.
# Edit the template, not this file: the next theme change overwrites it.

onboarding = false

[theme]
name = "terminal"
auto_switch = false

# The terminal theme leaves panel_bg as "reset", and text can't be drawn in the
# terminal's default *background*, so herdr falls back to surface_dim (ANSI
# bright black, light grey) for text on accent badges like the selected tab.
# Setting panel_bg to the wallust background (the same color foot uses, opaque)
# makes that text the real background color, and it follows theme changes.
[theme.custom]
panel_bg = "{{background}}"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
edit_scrollback = "prefix+v"
previous_tab = ""
next_tab = ""
rename_tab = ""
previous_agent = "prefix+p"
next_agent = "prefix+n"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "juju.tab-titles.rename"
description = "rename tab; empty restores automatic title"

[advanced]
scrollback_limit_bytes = 10000000

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = "~/.local/bin/herdr-agent-status", interval_seconds = 1, timeout_seconds = 2 },
  { type = "command", command = "~/.local/bin/herdr plugin action invoke juju.tab-titles.refresh >/dev/null 2>&1", interval_seconds = 3, timeout_seconds = 5 },
]
tab_bar_right_separator = " "

[ui.sidebar.agents]
rows = [["state_icon", "agent", "state_text"]]
