# bw-session policy. Parsed as KEY=VALUE data (never sourced); invalid values
# fall back to the defaults shown here.

# Absolute session lifetime in hours (1..24). Fixed at unlock; never renewed.
TTL_HOURS=8

# End the session on suspend/hibernate. Access is denied at once; the profile
# lock is attempted within logind's inhibitor delay and finished after resume.
LOCK_ON_SUSPEND=yes

# Lock the vault when the logind session locks (loginctl lock-session).
# Unlock prompts in flight are cancelled on screen lock either way.
LOCK_ON_SCREENLOCK=no

# Idle lock in minutes; 0 = off. The guard does not measure idle time itself:
# see README.md for the hypridle listener that enforces it.
IDLE_LOCK_MIN=0

# Passive "Bitwarden locked" notification on idle return / locked consumers.
REMIND=yes
