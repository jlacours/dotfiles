# cava feed for speakscope (SpeakScope.qml): raw levels on stdout while speak talks.
[general]
framerate = 60
bars = 24
autosens = 1
# Speech band only, so the center (lowest bars) is not flat.
lower_cutoff_freq = 140
higher_cutoff_freq = 6000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
