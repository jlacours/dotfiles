# Signal integration for the Hermes gateway.
# Hermes's updater regenerates hermes-gateway.service on every run and
# rewrites it with absolute paths, wiping hand edits. systemd merges
# drop-ins over the generated unit, so keep the Signal wiring here:
# the unit stays Hermes-owned and these settings survive updates.
[Unit]
Requires=signal-cli.service
After=signal-cli.service

[Service]
EnvironmentFile=-%h/.hermes/signal.env